# Render Blueprint — COLLECTOR background worker (data collection only).
#
# Point Render at this file (Blueprint Path = deploy/render/render.yaml) if you
# want the worker instead of the dashboard. See COLLECTOR_RENDER.md.
#
# Why a background worker and not a web service:
#   * it runs continuously (no "spins down after 15 min idle" that would drop
#     the websocket feed on a Free web service),
#   * it needs no public URL,
#   * it can carry a persistent disk so candle history survives redeploys.
#
# Cost note (Render pricing, 2026-11): background workers have NO free plan.
# The smallest is 0.5 CPU / 512 MB at $7/month, plus $0.25/GB/month for the disk
# (a 1 GB disk = $0.25/month). Pick a US region (Oregon/Ohio/Virginia) — the
# feed works from US datacenter IPs (verified: this project's Google Cloud US
# host connects fine), whereas the EU Warsaw egress we saw on Botkeep is blocked.
services:
  - type: worker
    name: quotex-collector
    runtime: docker
    dockerfilePath: ./deploy/render/Dockerfile.collector
    dockerContext: .
    plan: starter              # 0.5 CPU / 512 MB, $7/mo (no free worker plan)
    region: oregon             # US region; avoid Frankfurt if the feed is geo-blocked
    envVars:
      - key: CANDLE_DB
        value: /data/candles.db
      - key: COLLECTOR_STATE
        value: /data/collector_state.json
      - key: COLLECTOR_STORE_TICKS
        value: "0"             # candle-only (~63 MB/day; raw ticks ~1.3 GB/day)
      # - key: COLLECTOR_PAIRS
      #   value: EURUSD_otc,BTCUSD_otc   # optional: shrink scope
      # - key: QX_PROXY
      #   value: socks5://user:pass@host:1080  # only if this region is blocked
    disk:
      name: collector-data
      mountPath: /data
      sizeGB: 1
